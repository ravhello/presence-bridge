name: Bug report
description: Report a reproducible integration or receiver problem without private pairing data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Never paste QR codes, invitation links, IRKs,
        Bluetooth/MAC addresses, credentials, HA backups or unfiltered logs.
        For an app report, use Presence Pair > Report a problem and review the
        optional diagnostics before privately emailing support.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed pairing secrets and personal identifiers.
          required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App build, iOS, Home Assistant, integration, receiver and Windows/Linux/BlueZ versions.
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Bluetooth adapter
      description: Model and driver version only. No serial numbers or addresses.
  - type: dropdown
    id: situation
    attributes:
      label: Pairing situation
      options:
        - First pairing
        - Previously paired on both devices
        - Pairing removed on one device only
        - Presence after successful pairing
        - Other
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Include local Linux or remote MQTT mode, missing prerequisite/error codes, and whether a Windows pairing user was signed in. No private keys or raw Bluetooth logs.
    validations:
      required: true
