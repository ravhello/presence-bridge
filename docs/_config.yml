title: Presence Bridge
description: Local iPhone Bluetooth presence and estimated rooms for Home Assistant. Install with HACS, enroll with Presence Pair, and keep presence data in your home.
theme: jekyll-theme-minimal
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
url: https://ravhello.github.io
baseurl: /presence-bridge
lang: en
author: Riccardo Ravello
logo: /assets/presence-pair-icon.png
social:
  name: Presence Bridge
  links:
    - https://github.com/ravhello/presence-bridge
    - https://apps.apple.com/app/id6808059201
defaults:
  - scope:
      path: ""
    values:
      image: /assets/presence-pair-icon.png
github:
  repository_url: https://github.com/ravhello/presence-bridge
exclude:
  - Gemfile
  - Gemfile.lock
